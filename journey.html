<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Way Home | Begin Your Journey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <a href="/" style="display:inline-block; margin-bottom: 20px;">&larr; Back to Home</a>
    <h1>Begin Your Journey</h1>
    <p>This is where your conversation begins. Ask anything.</p>

    <div id="chat-box" style="border: 1px solid #ccc; padding: 10px; height: 200px; overflow-y: scroll; margin-bottom: 10px;">
      <p><em>Ave Maria GPT:</em> Welcome. Let’s begin.</p>
    </div>

    <input type="text" id="user-input" placeholder="Type your message..." style="width: 80%;" />
    <button onclick="sendMessage()" style="padding: 8px 12px;">Send</button>
  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById('user-input');
      const chatBox = document.getElementById('chat-box');
      const userText = input.value.trim();
      if (!userText) return;

      const userMessage = document.createElement('p');
      userMessage.innerHTML = "<strong>You:</strong> " + userText;
      chatBox.appendChild(userMessage);
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      // Placeholder for GPT response
      const gptReply = document.createElement('p');
      gptReply.innerHTML = "<em>Ave Maria GPT:</em> This is where I will respond.";
      chatBox.appendChild(gptReply);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
